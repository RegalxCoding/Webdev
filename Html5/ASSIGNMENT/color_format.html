<!DOCTYPE html>
<html>
  <head>
    <title>color format</title>
    <style>
      .back{
        background-color: rgb(0,0,255);
        color:rgb(250, 250, 250,0.8);
        display:flex;
        justify-content: center;
        border-radius: 20px;
      }
      .lst{
        background-color: rgba(0,255,0,0.4);
        color: rgb(255,0,255);
        font-size: 20px;
        border-radius: 20px;
        display:flex;
        margin-top: 20px;
      }
      .full{
        background-color: hsl(7, 88%, 61%);
        padding: 10px;
        display: flex;
        border-radius: 20px;
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .lst1{
        background-color:#f6eeee;
        border-radius: 20px;
        padding: 20px;
      }
      .five{
        background-color: hsl(67, 81%, 57%);
        display: flex;
        justify-content: center;
        margin:20px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
      
      <div class="back">
      <h1>Color Backgrounds</h1>
      </div>
      <div class="lst">
        <ol type="1">
          <li>HEX</li>
          <li>RGB</li>
          <li>RGBA</li>
          <li>HSL</li>
          <li>HSLA</li>
        </ol>
      </div>
      <div class="full">
          <ul type="disc">
            <li class="lst1">HEX- HEXADECIMAL colors</li>
          </ul>
           <ul type="disc">
            <li class="lst1">RGB-RGB()-RED_GREEN_BLUE</li>
           </ul>
           <ul type="disc">
            <li class="lst1">RGBA-RGB()-RED_GREEN_BLUE_ALPHA(OPACITY)</li>
           </ul>
           <ul type="disc">
            <li class="lst1">HSL-HUE_SATURATION_LIGHTNESS</li>
           </ul>
           <ul type="disc">
            <li class="lst1">HSLA-HUE_SATURATION_LIGHTNESS_ALPHA</li>
           </ul>
      </div>
      <div class="five">
        <h2>FIVE COLOR BACKGROUND PRACTICE</h2>
      </div>
      
 
  </body>
</html>
